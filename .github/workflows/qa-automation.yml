# QA guide: "Trigger automation runs after Dev merges; if pipeline fails, halt the merge; Slack notification".
name: QA automation
on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '30 20 * * 0-4'   # nightly regression (06:30 AEST Mon–Fri)
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tag expression, e.g. @smoke or @regression and @photo'
        default: '@smoke'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: spg-staging          # one run at a time – SPG allows one session per account
    env:
      SPG_API_URL: ${{ vars.SPG_API_URL }}
      SPG_CMS_URL: ${{ vars.SPG_CMS_URL }}
      SPG_ADMIN_EMAIL: ${{ vars.SPG_ADMIN_EMAIL }}
      SPG_ADMIN_PASSWORD: ${{ secrets.SPG_ADMIN_PASSWORD }}
      SPG_AWS_REGION: ${{ vars.SPG_AWS_REGION }}
      SPG_COGNITO_POOL_ID: ${{ vars.SPG_COGNITO_POOL_ID }}
      SPG_S3_BUCKET: ${{ vars.SPG_S3_BUCKET }}
      # PRs/pushes run smoke; the nightly run does the full regression pack.
      TAGS: ${{ github.event.inputs.tags || (github.event_name == 'schedule' && '@regression and not @wip') || '@smoke and not @wip' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx bddgen test && npx playwright test
      - if: always()
        run: node scripts/sprint-report.mjs "CI run ${{ github.run_number }}" || true
      - if: always()
        run: bash scripts/notify-slack.sh
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
